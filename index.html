<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listado de no compradores de mes en curso</title>
<style>
  :root{
    --bg:#f7f8fa;
    --surface:#ffffff;
    --border:#e2e5ea;
    --text:#1c2128;
    --text-muted:#6b7280;
    --accent:#3457d5;
    --accent-soft:#eef1fd;
    --danger:#b3261e;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:32px 24px 64px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header h1{
    font-size:1.65rem;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px 20px;
    align-items:center;
    color:var(--text-muted);
    font-size:0.92rem;
    margin-bottom:24px;
  }
  .meta-row .dot{color:var(--border);}
  #refresh-btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--accent);
    border-radius:8px;
    padding:5px 12px;
    font-size:0.85rem;
    cursor:pointer;
    font-weight:600;
  }
  #refresh-btn:hover{background:var(--accent-soft);}
  #refresh-btn:disabled{opacity:0.5;cursor:default;}

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:20px;
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:flex-end;
  }
  .field{display:flex;flex-direction:column;gap:6px;min-width:200px;flex:1;}
  .field label{font-size:0.78rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em;}
  select,input[type="text"]{
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:0.95rem;
    background:#fff;
    color:var(--text);
    font-family:inherit;
  }
  select:focus,input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .field.grow{flex:2;min-width:240px;}
  .clear-btn{
    border:none;background:none;color:var(--accent);
    font-size:0.85rem;font-weight:600;cursor:pointer;
    padding:9px 4px;
  }

  .status-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 12px;
    color:var(--text-muted);
    font-size:0.9rem;
  }
  .status-line strong{color:var(--text);}

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
  }
  thead th{
    text-align:left;
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--text-muted);
    background:#fafbfc;
    padding:11px 14px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
  }
  tbody td{
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    font-size:0.92rem;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--accent-soft);}
  .empty-state{
    text-align:center;
    padding:48px 20px;
    color:var(--text-muted);
  }
  .error-box{
    background:#fdecea;
    border:1px solid #f3c1bd;
    color:var(--danger);
    border-radius:var(--radius);
    padding:16px 18px;
    font-size:0.92rem;
  }
  footer{
    margin-top:28px;
    color:var(--text-muted);
    font-size:0.78rem;
    text-align:center;
  }
  @media (max-width:600px){
    body{padding:20px 14px 48px;}
    .filters{flex-direction:column;align-items:stretch;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Listado de no compradores de mes en curso</h1>
    <div class="meta-row">
      <span id="last-updated">Cargando datos del Sheet…</span>
      <span class="dot">•</span>
      <span id="fetched-at"></span>
      <button id="refresh-btn" type="button">Actualizar datos</button>
    </div>
  </header>

  <div class="panel">
    <div class="filters">
      <div class="field">
        <label for="f-vendedor">Nro Vendedor</label>
        <select id="f-vendedor"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="f-ruta">Ruta</label>
        <select id="f-ruta"><option value="">Todas</option></select>
      </div>
      <div class="field grow">
        <label for="f-search">Buscar cliente</label>
        <input type="text" id="f-search" placeholder="Nombre o código de cliente...">
      </div>
      <button class="clear-btn" id="clear-filters" type="button">Limpiar filtros</button>
    </div>
  </div>

  <div id="content">
    <div class="empty-state">Cargando…</div>
  </div>

  <footer>
    Los datos se obtienen en vivo desde el Google Sheet publicado (vía la función serverless /api/sheet). Se considera "no comprador" a todo cliente cuya columna "CCC x Bultos" está vacía.
  </footer>
</div>

<script>
// El CSV ya no se pide directo a Google desde el navegador (eso falla por
// CORS: Google no habilita Access-Control-Allow-Origin en ese endpoint).
// En su lugar se pide a nuestra propia función serverless /api/sheet.js,
// que hace el fetch del lado del servidor y no tiene restricción de CORS.
const DATA_ENDPOINT = "/api/sheet";

let allRows = [];

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); field = "";
      } else if (c === '\n') {
        row.push(field); field = "";
        rows.push(row); row = [];
      } else if (c === '\r') {
        // skip, handled by following \n
      } else {
        field += c;
      }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ""));
}

function normHeader(h) {
  return (h || "").trim().toLowerCase();
}

function fmtDate(d) {
  try {
    return new Intl.DateTimeFormat("es-AR", {
      dateStyle: "long",
      timeStyle: "short",
      timeZone: "America/Argentina/Buenos_Aires"
    }).format(d);
  } catch (e) {
    return d.toLocaleString("es-AR");
  }
}

function populateSelect(select, values, placeholderLabel) {
  const current = select.value;
  select.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = placeholderLabel;
  select.appendChild(opt0);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });
  if (values.includes(current)) select.value = current;
}

function render() {
  const vendedorSel = document.getElementById("f-vendedor").value;
  const rutaSel = document.getElementById("f-ruta").value;
  const search = document.getElementById("f-search").value.trim().toLowerCase();

  let filtered = allRows.filter(r => {
    if (vendedorSel && r.vendedor !== vendedorSel) return false;
    if (rutaSel && r.ruta !== rutaSel) return false;
    if (search && !r.cliente.toLowerCase().includes(search)) return false;
    return true;
  });

  const content = document.getElementById("content");

  if (allRows.length === 0) {
    content.innerHTML = '<div class="empty-state">No se encontraron datos en el Sheet.</div>';
    return;
  }

  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty-state">No hay clientes sin compra que coincidan con los filtros seleccionados.</div>';
    return;
  }

  let html = '<div class="status-line"><span><strong>' + filtered.length + '</strong> cliente(s) sin compra en el mes en curso</span></div>';
  html += '<table><thead><tr><th>Nro Vendedor</th><th>Ruta</th><th>Cliente</th></tr></thead><tbody>';
  filtered
    .slice()
    .sort((a, b) => a.cliente.localeCompare(b.cliente, "es"))
    .forEach(r => {
      html += "<tr><td>" + (r.vendedor || "—") + "</td><td>" + (r.ruta || "—") + "</td><td>" + escapeHtml(r.cliente) + "</td></tr>";
    });
  html += "</tbody></table>";
  content.innerHTML = html;
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

async function loadData() {
  const btn = document.getElementById("refresh-btn");
  btn.disabled = true;
  document.getElementById("last-updated").textContent = "Cargando datos del Sheet…";
  document.getElementById("content").innerHTML = '<div class="empty-state">Cargando…</div>';

  try {
    const res = await fetch(DATA_ENDPOINT + "?_ts=" + Date.now(), { cache: "no-store" });
    const payload = await res.json();

    if (!res.ok) {
      throw new Error(payload && payload.error ? payload.error : ("HTTP " + res.status));
    }

    const now = new Date();
    document.getElementById("fetched-at").textContent = "Última consulta: " + fmtDate(now);

    if (payload.lastModified) {
      document.getElementById("last-updated").innerHTML =
        'Última actualización del Sheet: <strong>' + fmtDate(new Date(payload.lastModified)) + "</strong>";
    } else {
      document.getElementById("last-updated").innerHTML =
        'Última actualización del Sheet: <span title="El Sheet no expone esta fecha; se muestra la hora de la última consulta">no disponible</span>';
    }

    const rows = parseCSV(payload.csv || "");
    if (rows.length === 0) { allRows = []; render(); return; }

    const header = rows[0].map(normHeader);
    const idxVendedor = header.findIndex(h => h.includes("vendedor"));
    const idxCliente = header.findIndex(h => h.includes("cliente") && !h.includes("cartera"));
    const idxRuta = header.findIndex(h => h.includes("ruta"));
    const idxCCC = header.findIndex(h => h.includes("ccc") || h.includes("bultos"));

    const data = rows.slice(1).filter(r => r.some(c => (c || "").trim() !== ""));

    // En el Sheet, "Nro Vendedor" y "Ruta" solo aparecen en la primera fila
    // de cada bloque (como con celdas combinadas): las filas siguientes
    // pertenecen al mismo vendedor/ruta hasta que aparece un valor nuevo.
    // Por eso se "rellena hacia abajo" (forward-fill) cada columna por
    // separado, en el orden en que vienen las filas.
    let lastVendedor = "";
    let lastRuta = "";

    allRows = data
      .map(r => {
        const vendedorRaw = (r[idxVendedor] || "").trim();
        const rutaRaw = (r[idxRuta] || "").trim();
        if (vendedorRaw !== "") lastVendedor = vendedorRaw;
        if (rutaRaw !== "") lastRuta = rutaRaw;
        return {
          vendedor: lastVendedor,
          ruta: lastRuta,
          cliente: (r[idxCliente] || "").trim(),
          ccc: (r[idxCCC] || "").trim()
        };
      })
      .filter(r => r.cliente !== "" && r.ccc === "");

    const vendedores = [...new Set(allRows.map(r => r.vendedor).filter(v => v !== ""))]
      .sort((a, b) => a.localeCompare(b, "es", { numeric: true }));
    const rutas = [...new Set(allRows.map(r => r.ruta).filter(v => v !== ""))]
      .sort((a, b) => a.localeCompare(b, "es", { numeric: true }));

    populateSelect(document.getElementById("f-vendedor"), vendedores, "Todos");
    populateSelect(document.getElementById("f-ruta"), rutas, "Todas");

    render();
  } catch (err) {
    document.getElementById("last-updated").textContent = "No se pudo cargar el Sheet.";
    document.getElementById("content").innerHTML =
      '<div class="error-box">Ocurrió un error al obtener los datos del Sheet: ' + escapeHtml(err.message) +
      '. Probá "Actualizar datos". Si el error persiste, revisá que el Sheet siga publicado (Archivo → Compartir → Publicar en la Web) y que la función /api/sheet esté desplegada en Vercel.</div>';
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("f-vendedor").addEventListener("change", render);
document.getElementById("f-ruta").addEventListener("change", render);
document.getElementById("f-search").addEventListener("input", render);
document.getElementById("clear-filters").addEventListener("click", () => {
  document.getElementById("f-vendedor").value = "";
  document.getElementById("f-ruta").value = "";
  document.getElementById("f-search").value = "";
  render();
});
document.getElementById("refresh-btn").addEventListener("click", loadData);

loadData();
</script>
</body>
</html>
