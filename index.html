<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listado de no compradores de mes en curso</title>
<style>
  :root{
    --bg:#f7f8fa;
    --surface:#ffffff;
    --border:#e2e5ea;
    --text:#1c2128;
    --text-muted:#6b7280;
    --accent:#3457d5;
    --accent-soft:#eef1fd;
    --danger:#b3261e;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:32px 24px 64px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header h1{
    font-size:1.65rem;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px 20px;
    align-items:center;
    color:var(--text-muted);
    font-size:0.92rem;
    margin-bottom:24px;
  }
  .meta-row .dot{color:var(--border);}
  #refresh-btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--accent);
    border-radius:8px;
    padding:5px 12px;
    font-size:0.85rem;
    cursor:pointer;
    font-weight:600;
  }
  #refresh-btn:hover{background:var(--accent-soft);}
  #refresh-btn:disabled{opacity:0.5;cursor:default;}

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:20px;
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:flex-end;
  }
  .field{display:flex;flex-direction:column;gap:6px;min-width:200px;flex:1;position:relative;}
  .field label{font-size:0.78rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em;}
  select,input[type="text"]{
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:0.95rem;
    background:#fff;
    color:var(--text);
    font-family:inherit;
    width:100%;
  }
  select:focus,input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .field.grow{flex:2;min-width:240px;}
  .clear-btn{
    border:none;background:none;color:var(--accent);
    font-size:0.85rem;font-weight:600;cursor:pointer;
    padding:9px 4px;
    white-space:nowrap;
  }

  /* Multiselect de Ruta */
  .multiselect{position:relative;}
  .multiselect-toggle{
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:0.95rem;
    background:#fff;
    color:var(--text);
    font-family:inherit;
    width:100%;
    text-align:left;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .multiselect-toggle:after{content:"▾";color:var(--text-muted);font-size:0.8rem;}
  .multiselect-toggle:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .multiselect-panel{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    box-shadow:0 8px 24px rgba(20,24,32,0.12);
    z-index:20;
    max-height:280px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .multiselect-panel[hidden]{display:none;}
  .multiselect-actions{
    display:flex;
    gap:6px;
    padding:8px 10px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .multiselect-actions button{
    border:none;background:var(--accent-soft);color:var(--accent);
    font-size:0.78rem;font-weight:600;border-radius:6px;
    padding:5px 8px;cursor:pointer;
  }
  .multiselect-options{overflow-y:auto;padding:6px 4px;}
  .multiselect-options label{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 10px;
    font-size:0.9rem;
    cursor:pointer;
    border-radius:6px;
  }
  .multiselect-options label:hover{background:var(--accent-soft);}
  .multiselect-options .empty{color:var(--text-muted);font-size:0.85rem;padding:8px 10px;}

  .actions-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .action-btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    border-radius:8px;
    padding:8px 14px;
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .action-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .action-btn:disabled{opacity:0.5;cursor:default;}

  .status-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 12px;
    color:var(--text-muted);
    font-size:0.9rem;
  }
  .status-line strong{color:var(--text);}

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
  }
  thead th{
    text-align:left;
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--text-muted);
    background:#fafbfc;
    padding:11px 14px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
  }
  tbody td{
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    font-size:0.92rem;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--accent-soft);}
  .empty-state{
    text-align:center;
    padding:48px 20px;
    color:var(--text-muted);
  }
  .error-box{
    background:#fdecea;
    border:1px solid #f3c1bd;
    color:var(--danger);
    border-radius:var(--radius);
    padding:16px 18px;
    font-size:0.92rem;
  }
  footer{
    margin-top:28px;
    color:var(--text-muted);
    font-size:0.78rem;
    text-align:center;
  }
  @media (max-width:600px){
    body{padding:20px 14px 48px;}
    .filters{flex-direction:column;align-items:stretch;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Listado de no compradores de mes en curso</h1>
    <div class="meta-row">
      <span id="last-updated">Cargando datos del Sheet…</span>
      <span class="dot">•</span>
      <span id="fetched-at"></span>
      <button id="refresh-btn" type="button">Actualizar datos</button>
    </div>
  </header>

  <div class="panel">
    <div class="filters">
      <div class="field">
        <label for="f-vendedor">Nro Vendedor</label>
        <input type="text" id="f-vendedor" list="vendedor-list" placeholder="Todos (número exacto o elegí de la lista)" autocomplete="off">
        <datalist id="vendedor-list"></datalist>
      </div>
      <div class="field" id="ruta-field">
        <label id="ruta-label">Ruta</label>
        <div class="multiselect" id="ruta-multiselect">
          <button type="button" id="ruta-toggle" class="multiselect-toggle" aria-haspopup="true" aria-expanded="false">Todas</button>
          <div class="multiselect-panel" id="ruta-panel" hidden>
            <div class="multiselect-actions">
              <button type="button" id="ruta-select-all">Seleccionar todas</button>
              <button type="button" id="ruta-select-none">Ninguna</button>
            </div>
            <div class="multiselect-options" id="ruta-options"></div>
          </div>
        </div>
      </div>
      <div class="field grow">
        <label for="f-search">Buscar cliente</label>
        <input type="text" id="f-search" placeholder="Nombre o código de cliente...">
      </div>
      <button class="clear-btn" id="clear-filters" type="button">Limpiar filtros</button>
    </div>
  </div>

  <div class="actions-row">
    <button class="action-btn" id="export-pdf-btn" type="button">⬇ Exportar PDF</button>
    <button class="action-btn" id="copy-btn" type="button">⧉ Copiar al portapapeles</button>
  </div>

  <div id="content">
    <div class="empty-state">Cargando…</div>
  </div>

  <footer>
    Los datos se obtienen en vivo desde el Google Sheet publicado (vía la función serverless /api/sheet). Se considera "no comprador" a todo cliente cuya columna "CCC x Bultos" está vacía.
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
// El CSV ya no se pide directo a Google desde el navegador (eso falla por
// CORS: Google no habilita Access-Control-Allow-Origin en ese endpoint).
// En su lugar se pide a nuestra propia función serverless /api/sheet.js,
// que hace el fetch del lado del servidor y no tiene restricción de CORS.
const DATA_ENDPOINT = "/api/sheet";

let allRows = [];
let selectedRutas = new Set(); // vacío = "todas"

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); field = "";
      } else if (c === '\n') {
        row.push(field); field = "";
        rows.push(row); row = [];
      } else if (c === '\r') {
        // skip, handled by following \n
      } else {
        field += c;
      }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ""));
}

function normHeader(h) {
  return (h || "").trim().toLowerCase();
}

function fmtDate(d) {
  try {
    return new Intl.DateTimeFormat("es-AR", {
      dateStyle: "long",
      timeStyle: "short",
      timeZone: "America/Argentina/Buenos_Aires"
    }).format(d);
  } catch (e) {
    return d.toLocaleString("es-AR");
  }
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function populateDatalist(values) {
  const list = document.getElementById("vendedor-list");
  list.innerHTML = "";
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    list.appendChild(opt);
  });
}

function currentVendedorFilter() {
  return document.getElementById("f-vendedor").value.trim().toLowerCase();
}

// El Cliente muestra "CODIGO - NOMBRE". Se compara por coincidencia exacta
// (del código solo, o del texto completo) para que escribir "5" traiga
// únicamente al vendedor 5, y no 25, 54, 500, etc.
function vendorCode(v) {
  const idx = (v || "").indexOf(" - ");
  return idx === -1 ? (v || "").trim() : v.slice(0, idx).trim();
}

function matchesVendedor(rowVendedor, filterText) {
  if (!filterText) return true;
  const code = vendorCode(rowVendedor).toLowerCase();
  const full = (rowVendedor || "").toLowerCase();
  return code === filterText || full === filterText;
}

// --- Multiselect de Ruta ---

function relevantRutaRows() {
  const vendedorFilter = currentVendedorFilter();
  return vendedorFilter ? allRows.filter(r => matchesVendedor(r.vendedor, vendedorFilter)) : allRows;
}

function updateRutaOptions() {
  // Las rutas que se ofrecen dependen del vendedor tipeado: si hay texto en
  // Nro Vendedor, solo se listan las rutas que existen dentro de esos
  // clientes; si no hay texto, se listan todas.
  const rutas = [...new Set(relevantRutaRows().map(r => r.ruta).filter(v => v !== ""))]
    .sort((a, b) => a.localeCompare(b, "es", { numeric: true }));

  // Descartar de la selección actual las rutas que ya no son válidas para
  // el vendedor tipeado.
  selectedRutas.forEach(r => { if (!rutas.includes(r)) selectedRutas.delete(r); });

  const optionsWrap = document.getElementById("ruta-options");
  optionsWrap.innerHTML = "";
  if (rutas.length === 0) {
    optionsWrap.innerHTML = '<div class="empty">No hay rutas para este filtro.</div>';
  } else {
    rutas.forEach(r => {
      const id = "ruta-opt-" + r.replace(/[^a-zA-Z0-9]/g, "_");
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = r;
      cb.id = id;
      cb.checked = selectedRutas.has(r);
      cb.addEventListener("change", () => {
        if (cb.checked) selectedRutas.add(r); else selectedRutas.delete(r);
        updateRutaToggleLabel();
        render();
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(r));
      optionsWrap.appendChild(label);
    });
  }
  updateRutaToggleLabel();
}

function updateRutaToggleLabel() {
  const btn = document.getElementById("ruta-toggle");
  if (selectedRutas.size === 0) btn.textContent = "Todas";
  else if (selectedRutas.size === 1) btn.textContent = [...selectedRutas][0];
  else btn.textContent = selectedRutas.size + " rutas seleccionadas";
}

function toggleRutaPanel(forceOpen) {
  const panel = document.getElementById("ruta-panel");
  const btn = document.getElementById("ruta-toggle");
  const shouldOpen = forceOpen !== undefined ? forceOpen : panel.hidden;
  panel.hidden = !shouldOpen;
  btn.setAttribute("aria-expanded", String(shouldOpen));
}

document.getElementById("ruta-toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  toggleRutaPanel();
});
document.addEventListener("click", (e) => {
  const ms = document.getElementById("ruta-multiselect");
  if (!ms.contains(e.target)) toggleRutaPanel(false);
});
document.getElementById("ruta-select-all").addEventListener("click", () => {
  const rutas = [...new Set(relevantRutaRows().map(r => r.ruta).filter(v => v !== ""))];
  selectedRutas = new Set(rutas);
  updateRutaOptions();
  render();
});
document.getElementById("ruta-select-none").addEventListener("click", () => {
  selectedRutas.clear();
  updateRutaOptions();
  render();
});

// --- Filtrado + render ---

function getFilteredRows() {
  const vendedorFilter = currentVendedorFilter();
  const search = document.getElementById("f-search").value.trim().toLowerCase();

  return allRows
    .filter(r => {
      if (!matchesVendedor(r.vendedor, vendedorFilter)) return false;
      if (selectedRutas.size > 0 && !selectedRutas.has(r.ruta)) return false;
      if (search && !r.cliente.toLowerCase().includes(search)) return false;
      return true;
    })
    .slice()
    .sort((a, b) => a.cliente.localeCompare(b.cliente, "es"));
}

function render() {
  const content = document.getElementById("content");

  if (allRows.length === 0) {
    content.innerHTML = '<div class="empty-state">No se encontraron datos en el Sheet.</div>';
    return;
  }

  const filtered = getFilteredRows();

  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty-state">No hay clientes sin compra que coincidan con los filtros seleccionados.</div>';
    return;
  }

  let html = '<div class="status-line"><span><strong>' + filtered.length + '</strong> cliente(s) sin compra en el mes en curso</span></div>';
  html += '<table><thead><tr><th>Nro Vendedor</th><th>Ruta</th><th>Cliente</th></tr></thead><tbody>';
  filtered.forEach(r => {
    html += "<tr><td>" + (r.vendedor || "—") + "</td><td>" + (r.ruta || "—") + "</td><td>" + escapeHtml(r.cliente) + "</td></tr>";
  });
  html += "</tbody></table>";
  content.innerHTML = html;
}

// --- Exportar PDF ---

function exportPDF() {
  const rows = getFilteredRows();
  if (rows.length === 0) {
    flashButton(document.getElementById("export-pdf-btn"), "Sin datos para exportar");
    return;
  }
  if (!window.jspdf) {
    flashButton(document.getElementById("export-pdf-btn"), "No se pudo cargar el generador de PDF");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "pt" });

  doc.setFontSize(14);
  doc.text("Listado de no compradores de mes en curso", 40, 40);

  doc.setFontSize(9);
  doc.setTextColor(110, 110, 110);
  const updatedText = document.getElementById("last-updated").textContent.replace(/\s+/g, " ").trim();
  doc.text(updatedText, 40, 58);
  doc.text(rows.length + " cliente(s) sin compra (con los filtros aplicados)", 40, 72);

  doc.autoTable({
    startY: 88,
    head: [["Nro Vendedor", "Ruta", "Cliente"]],
    body: rows.map(r => [r.vendedor || "—", r.ruta || "—", r.cliente]),
    styles: { fontSize: 9, cellPadding: 5 },
    headStyles: { fillColor: [52, 87, 213], textColor: 255 },
    alternateRowStyles: { fillColor: [247, 248, 250] }
  });

  const stamp = new Date().toISOString().slice(0, 10);
  doc.save("no-compradores-" + stamp + ".pdf");
}

// --- Copiar al portapapeles ---

async function copyToClipboard() {
  const btn = document.getElementById("copy-btn");
  const rows = getFilteredRows();
  if (rows.length === 0) {
    flashButton(btn, "Sin datos para copiar");
    return;
  }

  const header = ["Nro Vendedor", "Ruta", "Cliente"].join("\t");
  const lines = rows.map(r => [r.vendedor || "", r.ruta || "", r.cliente].join("\t"));
  const text = [header, ...lines].join("\n");

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    flashButton(btn, "✓ Copiado");
  } catch (err) {
    flashButton(btn, "No se pudo copiar");
  }
}

function flashButton(btn, message) {
  const original = btn.textContent;
  btn.textContent = message;
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = original;
    btn.disabled = false;
  }, 1600);
}

document.getElementById("export-pdf-btn").addEventListener("click", exportPDF);
document.getElementById("copy-btn").addEventListener("click", copyToClipboard);

// --- Carga de datos ---

async function loadData() {
  const btn = document.getElementById("refresh-btn");
  btn.disabled = true;
  document.getElementById("last-updated").textContent = "Cargando datos del Sheet…";
  document.getElementById("content").innerHTML = '<div class="empty-state">Cargando…</div>';

  try {
    const res = await fetch(DATA_ENDPOINT + "?_ts=" + Date.now(), { cache: "no-store" });
    const payload = await res.json();

    if (!res.ok) {
      throw new Error(payload && payload.error ? payload.error : ("HTTP " + res.status));
    }

    const now = new Date();
    document.getElementById("fetched-at").textContent = "Última consulta: " + fmtDate(now);

    if (payload.lastModified) {
      document.getElementById("last-updated").innerHTML =
        'Última actualización del Sheet: <strong>' + fmtDate(new Date(payload.lastModified)) + "</strong>";
    } else {
      document.getElementById("last-updated").innerHTML =
        'Última actualización del Sheet: <span title="El Sheet no expone esta fecha; se muestra la hora de la última consulta">no disponible</span>';
    }

    const rows = parseCSV(payload.csv || "");
    if (rows.length === 0) { allRows = []; render(); return; }

    const header = rows[0].map(normHeader);
    const idxVendedor = header.findIndex(h => h.includes("vendedor"));
    const idxCliente = header.findIndex(h => h.includes("cliente") && !h.includes("cartera"));
    const idxRuta = header.findIndex(h => h.includes("ruta"));
    const idxCCC = header.findIndex(h => h.includes("ccc") || h.includes("bultos"));

    const data = rows.slice(1).filter(r => r.some(c => (c || "").trim() !== ""));

    // En el Sheet, "Nro Vendedor" y "Ruta" solo aparecen en la primera fila
    // de cada bloque (como con celdas combinadas): las filas siguientes
    // pertenecen al mismo vendedor/ruta hasta que aparece un valor nuevo.
    // Por eso se "rellena hacia abajo" (forward-fill) cada columna por
    // separado, en el orden en que vienen las filas.
    let lastVendedor = "";
    let lastRuta = "";

    allRows = data
      .map(r => {
        const vendedorRaw = (r[idxVendedor] || "").trim();
        const rutaRaw = (r[idxRuta] || "").trim();
        if (vendedorRaw !== "") lastVendedor = vendedorRaw;
        if (rutaRaw !== "") lastRuta = rutaRaw;
        return {
          vendedor: lastVendedor,
          ruta: lastRuta,
          cliente: (r[idxCliente] || "").trim(),
          ccc: (r[idxCCC] || "").trim()
        };
      })
      .filter(r => r.cliente !== "" && r.ccc === "");

    const vendedores = [...new Set(allRows.map(r => r.vendedor).filter(v => v !== ""))]
      .sort((a, b) => a.localeCompare(b, "es", { numeric: true }));

    populateDatalist(vendedores);
    updateRutaOptions();

    render();
  } catch (err) {
    document.getElementById("last-updated").textContent = "No se pudo cargar el Sheet.";
    document.getElementById("content").innerHTML =
      '<div class="error-box">Ocurrió un error al obtener los datos del Sheet: ' + escapeHtml(err.message) +
      '. Probá "Actualizar datos". Si el error persiste, revisá que el Sheet siga publicado (Archivo → Compartir → Publicar en la Web) y que la función /api/sheet esté desplegada en Vercel.</div>';
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("f-vendedor").addEventListener("input", () => {
  // Al cambiar el vendedor tipeado, la ruta elegida podría ya no
  // pertenecerle: se recalculan las opciones (updateRutaOptions ya
  // descarta las que no correspondan) y se vuelve a renderizar.
  updateRutaOptions();
  render();
});
document.getElementById("f-search").addEventListener("input", render);
document.getElementById("clear-filters").addEventListener("click", () => {
  document.getElementById("f-vendedor").value = "";
  document.getElementById("f-search").value = "";
  selectedRutas.clear();
  updateRutaOptions();
  render();
});
document.getElementById("refresh-btn").addEventListener("click", loadData);

loadData();
</script>
</body>
</html>
